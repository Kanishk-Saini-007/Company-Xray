name: Refresh news and markets
on:
  schedule:
    - cron: '7 * * * *'   # about hourly (GitHub may delay scheduled runs)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: refresh-data, cancel-in-progress: false }
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build_news.mjs
      - name: Commit if changed
        run: |
          git config user.name "xray-bot"
          git config user.email "xray-bot@users.noreply.github.com"
          git add data/news.json data/markets.json
          git diff --cached --quiet || (git commit -m "data: refresh news and markets" && git pull --rebase -q && git push)
